<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro</title>
<style>
:root{
  --bg:#ffffff; --text:#37352f; --muted:rgba(55,53,47,.6); --line:rgba(55,53,47,.16);
  --hover:rgba(55,53,47,.08); --accent:#eb5757; --accent-bg:rgba(235,87,87,.12);
  --break:#0f7b6c; --break-bg:rgba(15,123,108,.12);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191919; --text:rgba(255,255,255,.88); --muted:rgba(255,255,255,.5); --line:rgba(255,255,255,.14);
    --hover:rgba(255,255,255,.08); --accent:#ff7369; --accent-bg:rgba(255,115,105,.16);
    --break:#4dab9a; --break-bg:rgba(77,171,154,.16); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191919; --text:rgba(255,255,255,.88); --muted:rgba(255,255,255,.5); --line:rgba(255,255,255,.14);
  --hover:rgba(255,255,255,.08); --accent:#ff7369; --accent-bg:rgba(255,115,105,.16);
  --break:#4dab9a; --break-bg:rgba(77,171,154,.16); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.wrap{width:100%; max-width:420px; text-align:center}
.tabs{display:inline-flex; gap:4px; padding:3px; border-radius:6px; background:var(--hover); margin-bottom:20px}
.tab{
  font:inherit; font-size:14px; color:var(--muted); background:transparent; border:0;
  padding:5px 12px; border-radius:4px; cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--bg); color:var(--text); box-shadow:0 0 0 1px var(--line)}
.tab:focus-visible,.btn:focus-visible{outline:2px solid #2383e2; outline-offset:2px}
.time{
  font-size:clamp(64px,22vw,96px); font-weight:700; letter-spacing:-.02em; line-height:1;
  font-variant-numeric:tabular-nums; margin:0 0 6px;
}
.label{font-size:14px; color:var(--muted); margin:0 0 18px; min-height:20px}
.bar{height:4px; border-radius:2px; background:var(--hover); overflow:hidden; margin:0 auto 22px; max-width:320px}
.fill{height:100%; width:0; background:var(--accent); transition:width .5s linear}
body.break .fill{background:var(--break)}
.row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.btn{
  font:inherit; font-size:14px; color:var(--text); background:transparent; border:1px solid var(--line);
  padding:7px 14px; border-radius:6px; cursor:pointer;
}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent); border-color:transparent; color:#fff; font-weight:500; min-width:96px}
body.break .btn.primary{background:var(--break)}
.btn.primary:hover{filter:brightness(.95)}
.count{margin-top:22px; font-size:13px; color:var(--muted)}
.dots{display:flex; gap:6px; justify-content:center; margin-top:8px; min-height:14px; flex-wrap:wrap}
.dot{width:12px; height:12px; border-radius:50%; background:var(--accent-bg); border:1px solid var(--accent)}
.dot.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="tabs" role="tablist" aria-label="Modo">
    <button class="tab" role="tab" id="tab-focus" aria-selected="true">Foco · 25 min</button>
    <button class="tab" role="tab" id="tab-break" aria-selected="false">Descanso · 5 min</button>
  </div>
  <p class="time" id="time" aria-live="off">25:00</p>
  <p class="label" id="label">Listo para empezar</p>
  <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
  <div class="row">
    <button class="btn primary" id="start">Empezar</button>
    <button class="btn" id="reset">Reiniciar</button>
    <button class="btn" id="skip">Saltar</button>
  </div>
  <div class="count"><span id="count">0 pomodoros hoy</span><div class="dots" id="dots"></div></div>
</main>
<script>
(function(){
  var DUR={focus:25*60, break:5*60};
  var mode='focus', remaining=DUR.focus, running=false, endAt=0, tick=null, done=0;
  var $=function(i){return document.getElementById(i)};
  var today=new Date().toISOString().slice(0,10);

  try{
    var s=JSON.parse(localStorage.getItem('pomo-notion')||'null');
    if(s && s.day===today) done=s.done||0;
  }catch(e){}
  function save(){ try{localStorage.setItem('pomo-notion',JSON.stringify({day:today,done:done}))}catch(e){} }

  function fmt(t){var m=Math.floor(t/60), s=t%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}

  function beep(){
    try{
      var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
      var c=new C(), t=c.currentTime;
      [0,.25,.5].forEach(function(d){
        var o=c.createOscillator(), g=c.createGain();
        o.frequency.value=mode==='focus'?660:880; o.connect(g); g.connect(c.destination);
        g.gain.setValueAtTime(.0001,t+d); g.gain.exponentialRampToValueAtTime(.2,t+d+.02);
        g.gain.exponentialRampToValueAtTime(.0001,t+d+.2); o.start(t+d); o.stop(t+d+.22);
      });
    }catch(e){}
  }

  function render(){
    $('time').textContent=fmt(remaining);
    $('fill').style.width=((1-remaining/DUR[mode])*100)+'%';
    document.body.classList.toggle('break',mode==='break');
    $('tab-focus').setAttribute('aria-selected',mode==='focus');
    $('tab-break').setAttribute('aria-selected',mode==='break');
    $('start').textContent=running?'Pausar':(remaining<DUR[mode]?'Continuar':'Empezar');
    $('label').textContent=running?(mode==='focus'?'Concentrado en una sola cosa':'Aléjate de la pantalla'):(remaining<DUR[mode]?'En pausa':'Listo para empezar');
    $('count').textContent=done+(done===1?' pomodoro hoy':' pomodoros hoy');
    var d=$('dots'); d.innerHTML='';
    for(var i=0;i<Math.min(done,12);i++){var e=document.createElement('span'); e.className='dot on'; d.appendChild(e)}
    document.title=(running?fmt(remaining)+' · ':'')+(mode==='focus'?'Foco':'Descanso');
  }

  function stop(){running=false; clearInterval(tick); tick=null}
  function setMode(m){stop(); mode=m; remaining=DUR[m]; render()}

  function finish(){
    stop(); beep();
    if(mode==='focus'){done++; save(); setMode('break')} else {setMode('focus')}
    $('label').textContent=mode==='break'?'¡Bien hecho! Toca descansar':'Descanso terminado. ¿Otro pomodoro?';
  }

  function loop(){
    remaining=Math.max(0,Math.round((endAt-Date.now())/1000));
    render();
    if(remaining<=0) finish();
  }

  $('start').onclick=function(){
    if(running){stop(); render(); return}
    running=true; endAt=Date.now()+remaining*1000;
    tick=setInterval(loop,250); render();
  };
  $('reset').onclick=function(){setMode(mode)};
  $('skip').onclick=function(){
    if(mode==='focus') setMode('break'); else setMode('focus');
  };
  $('tab-focus').onclick=function(){setMode('focus')};
  $('tab-break').onclick=function(){setMode('break')};
  render();
})();
</script>
</body>
</html>
